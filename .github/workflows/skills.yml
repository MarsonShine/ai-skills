name: skills

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate catalog and frontmatter
        run: python scripts/check_skill_catalog.py

      - name: Validate installable package contents
        run: python scripts/check_skill_package.py

      - name: Check harness document recovery
        run: python scripts/test_bootstrap_harness.py

      - name: Check read-only session closeout
        run: python scripts/test_closeout.py

      - name: Setup Node for WeChat draft checks
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check WeChat previews, image preparation and draft recovery
        run: |
          python -m pip install -r skills/wechat-mp-publisher/requirements.txt
          python -B scripts/test_wechat_images.py
          node --test scripts/test_wechat_*.mjs

      - name: Check WorkBuddy article profile, voice, rewrite, image and render flow
        run: |
          python -m pip install -r skills/workbuddy-wechat-article/requirements.txt
          python -B scripts/test_workbuddy_article.py

      - name: Rebuild image-tool dependencies
        run: python -m pip install -r skills/photo-selector/requirements.txt -r skills/id-photo-maker/requirements.txt

      - name: Check background-removal runtime
        run: python -c "import rembg"

      - name: Smoke local image tools
        run: python -B scripts/smoke_image_tools.py
