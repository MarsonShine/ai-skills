name: skills

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate catalog and frontmatter
        run: python scripts/check_skill_catalog.py

      - name: Validate installable package contents
        run: python scripts/check_skill_package.py

      - name: Check harness document recovery
        run: python scripts/test_bootstrap_harness.py

      - name: Check read-only session closeout
        run: python scripts/test_closeout.py

      - name: Rebuild image-tool dependencies
        run: python -m pip install -r skills/photo-selector/requirements.txt -r skills/id-photo-maker/requirements.txt

      - name: Check background-removal runtime
        run: python -c "import rembg"

      - name: Smoke local image tools
        run: python -B scripts/smoke_image_tools.py
